
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grazia Styling Studio</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f2ed;
      color: #222;
      text-align: center;
    }

    header {
      padding: 25px;
      letter-spacing: 4px;
      font-size: 22px;
      font-weight: bold;
    }

    p {
      font-size: 13px;
      letter-spacing: 1px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: #f5f2ed;
    }
  </style>
</head>

<body>

  <header>GRAZIA</header>

  <p>STYLING STUDIO — SS2027</p>

  <p>Explore your look in 3D and AR</p>

  <model-viewer
    src="mannequin.glb"
    alt="3D fashion mannequin"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    shadow-intensity="1"
    exposure="1">

    <button slot="ar-button">
      View in Your Space
    </button>

  </model-viewer>

  <p>Rotate • Explore • Experience</p>

</body>
</html>
