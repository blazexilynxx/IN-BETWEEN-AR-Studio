
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grazia | Look 02</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ef;
      color: #252525;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 25px 15px 10px;
      font-family: Georgia, serif;
      font-size: 32px;
      letter-spacing: 5px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .heading {
      font-family: Georgia, serif;
      font-size: 25px;
      margin: 25px 10px 8px;
    }

    .description {
      font-size: 13px;
      color: #777;
      margin: 10px 15px 20px;
    }

    .viewer-container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 0 15px;
    }

    model-viewer {
      width: 100%;
      height: 550px;
      background: #eeece7;
      border-radius: 5px;
      --poster-color: #eeece7;
    }

    .navigation {
      margin: 25px 10px;
    }

    .navigation a {
      display: inline-block;
      padding: 13px 25px;
      margin: 5px;
      border: 1px solid #333;
      color: #333;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .navigation a.active,
    .navigation a:hover {
      background: #292929;
      color: white;
    }

    .instructions {
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
      margin: 20px;
    }

    footer {
      padding: 25px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #888;
    }

    @media (max-width: 600px) {
      model-viewer {
        height: 450px;
      }
    }
  </style>
</head>

<body>

  <header>GRAZIA</header>

  <div class="subtitle">
    STYLING STUDIO · MY COLLECTION
  </div>

  <h2 class="heading">LOOK 02</h2>

  <p class="description">
    Discover the look from every angle.
    Rotate and explore the 3D model.
  </p>

  <div class="viewer-container">

    <model-viewer
      src="look02.glb"
      alt="Grazia Fashion Look 02"
      camera-controls
      auto-rotate
      rotation-per-second="15deg"
      camera-orbit="0deg 75deg auto"
      min-camera-orbit="auto 75deg auto"
      max-camera-orbit="auto 75deg auto"
      shadow-intensity="1"
      exposure="1"
      interaction-prompt="auto"
      loading="eager">
    </model-viewer>

  </div>

  <div class="navigation">
  <a href="look01.html">LOOK 01</a>
  <a href="look02.html" class="active">LOOK 02</a>
  <a href="look03.html">LOOK 03</a>
  </div>

  <p class="instructions">
    DRAG TO ROTATE · SCROLL TO ZOOM
  </p>

  <footer>
    GRAZIA MALAYSIA · SS2027 · IN-BETWEEN
  </footer>

</body>
</html>
